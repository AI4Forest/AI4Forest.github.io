{% if page.page_header.enable %}
<style>
  @media (min-width: 992px) {
    .team-header-wrapper {
      min-height: 60vh !important;
    }
  }
  @media (max-width: 991px) {
    .team-header-wrapper {
      min-height: 40vh !important;
    }
  }
  /* Custom styling for team page header */
  .team-header-wrapper .page-title {
    font-weight: 500 !important;
    font-size: 3rem !important;
    line-height: 2.2rem !important;
    margin-bottom: 0 !important;
    text-transform: none !important;
    letter-spacing: normal !important;
  }
  /* Team page specific menu styling */
  .navbar-nav .nav-link,
  .dropdown-item,
  .mega-menu-content a {
    color: #ffffff !important;
    font-weight: 500 !important;
    font-size: 1rem !important;
  }
</style>
<div class="wrapper image-wrapper bg-image page-title-wrapper inverse-text team-header-wrapper" 
     data-image-src="{{page.page_header.background_image}}"
     style="background-position: center top; background-size: contain; background-repeat: no-repeat; margin-bottom: -2rem; display: flex; align-items: center; justify-content: center;">
  <div class="container inner text-center" style="padding: 0.5rem;">
    {% if page.page_header.title %}
     <h1 class="page-title" style="margin-bottom: 0;">{{page.page_header.title}}</h1>
    {% endif %}
    {% if page.page_header.sub_title %}
     <p class="lead">{{page.page_header.sub_title}}</p>
     {% endif %}
  </div>
  <!-- /.container -->
</div>
<!-- /.wrapper -->
{% endif %}
